<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled FDC Web Experience</title>

    <link rel="stylesheet" type="text/css" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Nova+Round&display=swap" rel="stylesheet">
</head>
<body>
    <div id="current-room">Main entrance</div>
    <div id="text-box" class="hidden" onclick="skipTypewriter()">
        <div id="text-box-content"></div>
        <div id="options">
            <div id="option1"></div>
            <div id="option2"></div>
        </div>
        <div id="exit-text-box" class="interactable" onclick="exitTextBox()">x</div>
    </div>

    <div class="entrance">
        <img class="background" src="../images/outisde-entrance.jpg" onclick="exitTextBox()"/>
        <div class="main-door interactable" onclick="startTypewriter('main-door')"></div>
    </div>

    <div class="movement">
        <div class="down"><a href='../index.html'>↓</a></div>
        <div class="left"><a href='exterior-left.html'>←</a></div>
        <div class="right">→</div>
    </div>

    <script src="../scripts/text-box.js"></script>
</body>
</html>
